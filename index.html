<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoMO Guard – Khu tương tác</title>
  <meta name="description" content="Phòng khách tương tác: chạm đồ vật để mở Page FoMO Guard, Flipbook Bye FoMO, Podcast Phô Mô 101 và mẹo chống FoMO.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>FoMO Guard</h1>
    <p>✨ Hãy chạm vào các đồ vật, chúng sẽ đưa bạn tới những điều kì diệu ✨</p>
  </header>

  <main class="container">
    <!-- Ảnh nền + Hotspots -->
    <div class="stage" style="--bg:url('background.jpg')">
      <!-- TV → Page Facebook -->
      <a class="hotspot link" style="--x:18%;--y:64%"
         href="https://www.facebook.com/share/1TM49v88g5/?mibextid=wwXIfr" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="tooltip">Page “FoMO Guard”</span>
      </a>

      <!-- Sách trên bàn → Flipbook -->
      <a class="hotspot link" style="--x:41%;--y:69%"
         href="https://heyzine.com/flip-book/34e7126c8a.html" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="tooltip">Flipbook “Bye FoMO”</span>
      </a>

      <!-- Radio → Podcast -->
      <a class="hotspot link" style="--x:56%;--y:41%"
         href="https://open.spotify.com/show/3B9HGdUuJzUZQldekkpF5m?si=52SPn-7uQHuv7QiMq99T-A" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="tooltip">Podcast “Phô Mô 101”</span>
      </a>

      <!-- Poster SALE → Popup mẹo -->
      <button class="hotspot" style="--x:67%;--y:54%"
              data-title="SALE ảo coi chừng!"
              data-text="Đừng để FoMO khiến bạn mua đồ không cần. Mua vì nhu cầu thật, không phải vì 'sợ bỏ lỡ'.">
        <span class="dot"></span>
        <span class="tooltip">Đừng FOMO mua đồ</span>
      </button>

      <!-- Điện thoại → Popup mẹo -->
      <button class="hotspot" style="--x:58%;--y:69%"
              data-title="Cất điện thoại xíu nha 📱"
              data-text="Thông báo không phải lúc nào cũng quan trọng. Dành thời gian cho việc bạn thích – ngoài kia còn nhiều điều thú vị!">
        <span class="dot"></span>
        <span class="tooltip">Bớt dùng điện thoại</span>
      </button>

      <!-- Cây → Popup mẹo -->
      <button class="hotspot" style="--x:88%;--y:72%"
              data-title="Tưới cây đi nè 🌿"
              data-text="Chăm cây đều đặn giúp giảm căng thẳng và giảm FoMO. Cho em nó 'uống nước' đều nha!">
        <span class="dot"></span>
        <span class="tooltip">Nhớ tưới cây</span>
      </button>
    </div>

    <!-- Nút nhanh bên dưới -->
    <div class="buttons">
      <a class="btn" href="https://www.facebook.com/share/1TM49v88g5/?mibextid=wwXIfr" target="_blank" rel="noopener">🛡️ Page “FoMO Guard”</a>
      <a class="btn" href="https://heyzine.com/flip-book/34e7126c8a.html" target="_blank" rel="noopener">📘 Flipbook “Bye FoMO”</a>
      <a class="btn" href="https://open.spotify.com/show/3B9HGdUuJzUZQldekkpF5m?si=52SPn-7uQHuv7QiMq99T-A" target="_blank" rel="noopener">🎧 Podcast “Phô Mô 101”</a>
    </div>
  </main>

  <!-- Modal popup -->
  <dialog id="pop" class="modal">
    <form method="dialog" class="modal-card">
      <h3 id="pop-title">Tiêu đề</h3>
      <p id="pop-text">Nội dung</p>
      <menu>
        <button value="cancel" class="close-btn">Đã hiểu</button>
      </menu>
    </form>
  </dialog>

  <footer class="site-footer">© 2025 FoMO Guard · Nguyễn Mai Gia Hòa và Phạm Minh Anh</footer>

  <script src="script.js"></script>
</body>
</html>
